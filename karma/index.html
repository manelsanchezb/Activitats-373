<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>
    <header>
        <nav>
            <img src="/karma/img/favicon.ico" alt="Logo Karma">
            <button>☰</button>
        </nav>
        <div class="hero">
            <h1 style="text-align: center;">Introducing <br>
            Karma
            </h1>
            <br>
            <h2 style="text-align: center;">Bring WiFi with you, <br>
            everywhere you go.
            </h2>
            <br>
            <button>Learn More</button>
        </div>
        
       

    </header>
    <main>
        <h2 style="text-align: center;">Everyone needs a little <br>
            Karma.
        </h2>
        <div class="devices">
            <img src="/karma/img/icon-devices.svg" alt="icon-devices">
            <p style="text-align: center;">Internet for all devices</p>
        </div>
        
        <div class="coffee">
            <img src="/karma/img/icon-coffee.svg" alt="icon-coffee">
            <p style="text-align: center;">Boost your productivity</p>
        </div>
        <div class="refill">
            <img src="/karma/img/icon-refill.svg" alt="icon-refill">
            <p style="text-align: center;">Pay as You Go</p>
        </div>
        
    </main>
    <footer>
        <hr> <!--El hr serveix per la linea de separacio-->

        <p>Join us on</p>
        <div class="xarxes-socials">
            <a href="#">
                <img src="/karma/img/twitter-icon.svg" alt="Twitter">
            </a>
            <a href="#">
                <img src="/karma/img/facebook-icon.svg" alt="Facebook">
            </a>
            <a href="#">
                <img src="/karma/img/instagram-icon.svg" alt="Instagram">
            </a>

            <p>© Karma Mobility, Inc.</p>

        </div>

    </footer>
    
</body>
</html>
