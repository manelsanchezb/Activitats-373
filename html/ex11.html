<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <form>
            <label for="name">Nom: </label>
            <input type="text" id="name" name="name" required><br>
            <label for="correu">Correu: </label> <!--El camp de correu al posar que el type es email ya valida si es valid o no -->
            <input type="email" id="correu" name="correu"><br>
            <label for="contrasenya">Contrasenya: </label>
            <input type="password" id="contrasenya" name="contrasenya" minlength="8"><br>
            <label for="telefon">Telefon: </label>
            <input type="tel" id="telefon" name="telefon" pattern="[0-9]{9}"><br>
        </form>
    </main>
</body>
</html>
